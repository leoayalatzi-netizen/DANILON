<!doctype html>
<html lang="es"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>PriomGL Quantum · Calabozos y Dragones</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:system-ui,sans-serif}
#c{width:100%;height:100%;display:block;outline:none;touch-action:none}
#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:16px;background:rgba(10,14,26,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
#ui button{all:unset;cursor:pointer;padding:10px 16px;border-radius:10px;color:#cfd6f0;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
#ui button.on{background:rgba(255,255,255,.16);color:#fff}
#ui:empty{display:none}
#info{position:fixed;top:calc(env(safe-area-inset-top,0px) + 44px);left:22px;right:22px;display:none;color:#cfe0ff;font:11px/1.55 ui-monospace,monospace;white-space:pre-wrap;text-shadow:0 1px 3px #000;pointer-events:none}
#ui button{padding:10px 12px}
#t{position:fixed;top:18px;left:22px;color:#fff;font-size:12px;letter-spacing:.3em;opacity:.8}
</style></head><body>
<div id="t">CALABOZOS Y DRAGONES</div>
<div id="info"></div>
<canvas id="c"></canvas>
<div id="boot" style="position:fixed;top:60px;left:22px;right:22px;color:#9fb0e8;font:13px monospace">PriomGL Quantum · iniciando…</div>
<script>
(function(){function show(m){var d=document.getElementById("err");if(!d){d=document.createElement("pre");d.id="err";d.style.cssText="position:fixed;top:100px;left:12px;right:12px;margin:0;padding:12px;background:rgba(120,0,20,.9);color:#fff;font:12px monospace;white-space:pre-wrap;border-radius:8px;z-index:9";document.body.appendChild(d)}d.textContent+=m+"\n"}
addEventListener("error",function(e){var t=e.target;show(t&&t.src?"No cargó: "+t.src:"Error: "+e.message)},true);
addEventListener("unhandledrejection",function(e){show("Error: "+((e.reason&&e.reason.message)||e.reason))});
setTimeout(function(){if(!window.__ok)show("Sigue cargando… si pasan 30 s sin cambios, la conexión es lenta o el JS falló.")},12000);})();
</script>

<div id="ui"></div>
<script type="module" src="/src/main.ts"></script>
</body></html>
